name: Build & Publish Operator Images

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-operator:
    name: Build & Push Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build operator binary
        run: |
          VERSION="${{ github.ref_name }}"
          VERSIONV=$(echo "${VERSION}" | sed 's/^v//')
          SHA=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X github.com/minio/operator/pkg.ReleaseTag=${VERSIONV} -X github.com/minio/operator/pkg.Version=${VERSION} -X github.com/minio/operator/pkg.ShortCommitID=${SHA}"
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "${LDFLAGS}" -o minio-operator ./cmd/operator

      - name: Determine Tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_BASE="ghcr.io/${REPO_OWNER}/operator"
          TAGS="${GHCR_BASE}:latest,${GHCR_BASE}:${{ github.sha }},${GHCR_BASE}:microk8s-latest"
          REF_CLEAN=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAGS="${TAGS},${GHCR_BASE}:${REF_CLEAN}"
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${GHCR_BASE}:${{ github.event.inputs.custom_tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-sidecar:
    name: Build & Push Operator Sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sidecar binary
        working-directory: sidecar
        run: |
          VERSION="${{ github.ref_name }}"
          VERSIONV=$(echo "${VERSION}" | sed 's/^v//')
          SHA=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X github.com/lgcorzo/operator/sidecar/pkg.ReleaseTag=${VERSIONV} -X github.com/lgcorzo/operator/sidecar/pkg.Version=${VERSION} -X github.com/lgcorzo/operator/sidecar/pkg.ShortCommitID=${SHA}"
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "${LDFLAGS}" -o ./minio-operator-sidecar ./cmd/sidecar

      - name: Determine Tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_BASE="ghcr.io/${REPO_OWNER}/operator-sidecar"
          TAGS="${GHCR_BASE}:latest,${GHCR_BASE}:${{ github.sha }},${GHCR_BASE}:microk8s-latest"
          REF_CLEAN=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAGS="${TAGS},${GHCR_BASE}:${REF_CLEAN}"
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${GHCR_BASE}:${{ github.event.inputs.custom_tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: sidecar
          file: sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
